<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>

<body bgcolor="#ECECEC">

    <br><br>

    <table border="4" align="center" cellpadding="20" width="80%">
        <tr>
            <td>

                <h1 align="center">Job Application Form</h1>

                <form>

                    <table border="1" cellpadding="10"  align="center">

                        <tr>
                            <td><b>Full Name:</b></td>
                            <td>
                                <input type="text" placeholder="Enter your name">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Email Address:</b></td>
                            <td>
                                <input type="email">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Phone Number:</b></td>
                            <td>
                                <input type="tel" placeholder="123-456-7890">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Gender:</b></td>
                            <td>
                                <input type="radio" name="gender"> Male
                                <input type="radio" name="gender"> Female
                            </td>
                        </tr>

                        <tr>
                            <td><b>Job Role:</b></td>
                            <td>
                                <select>
                                    <option hidden>-- Select Role --</option>
                                    <option>Web Developer</option>
                                    <option>Designer</option>
                                    <option>Software Engineer</option>
                                    <option>Tester</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td><b>Date of Birth:</b></td>
                            <td>
                                <input type="date">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Favorite Color:</b></td>
                            <td>
                                <input type="color">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Upload Resume:</b></td>
                            <td>
                                <input type="file">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Skills:</b></td>
                            <td>
                                <input type="checkbox"> HTML
                                <input type="checkbox"> CSS
                                <input type="checkbox"> JavaScript
                                <input type="checkbox"> React
                            </td>
                        </tr>

                        <tr>
                            <td><b>Cover Letter:</b></td>
                            <td>
                                <textarea  placeholder="Write something about yourself..."></textarea>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Submit">
                                <input type="reset" value="Reset">
                            </td>
                        </tr>

                    </table>

                </form>

            </td>
        </tr>
    </table>

</body>
</html>
